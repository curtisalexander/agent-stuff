name: PowerShell extension

on:
  push:
    paths:
      - ".github/workflows/powershell.yml"
      - "extensions/powershell.ts"
      - "scripts/install-powershell-linux.sh"
      - "scripts/test-powershell-extension.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  pull_request:
    paths:
      - ".github/workflows/powershell.yml"
      - "extensions/powershell.ts"
      - "scripts/install-powershell-linux.sh"
      - "scripts/test-powershell-extension.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  workflow_dispatch:

jobs:
  integration:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Install PowerShell on Linux
        if: runner.os == 'Linux'
        run: |
          npm run setup:powershell
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm run check
      - run: npm run test:powershell
